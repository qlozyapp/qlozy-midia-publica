name: Testes do publicador

on:
  pull_request:
  push:
    branches: [main]
    paths: ["publicador/**", "agenda/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -m unittest discover -s publicador -v
      - run: python3 publicador/publicar.py validar
